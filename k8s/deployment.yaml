apiVersion: apps/v1
kind: Deployment

metadata:
  name: cia2-deployment
  namespace: cia2

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cia2

  template:
    metadata:
      labels:
        app: cia2

    spec:
      containers:
        - name: cia2-container
          image: surya020406/cia2-cicd:v1

          ports:
            - containerPort: 8080

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
